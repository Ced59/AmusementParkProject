worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 65;
  etag on;

  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_for $preserved_forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
  }

  map $http_x_forwarded_proto $preserved_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_x_forwarded_host $preserved_forwarded_host {
    default $http_x_forwarded_host;
    '' $http_host;
  }

  map $http_x_forwarded_port $preserved_forwarded_port {
    default $http_x_forwarded_port;
    '' $server_port;
  }

  server {
    listen 4000;
    server_name _;
    root /srv/seo;

    location = /edge-healthz {
      access_log off;
      return 204;
    }

    error_page 418 = @front;
    include /tmp/seo-static-routing.conf;

    location @front {
      set $front_backend front:4000;
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location / {
      set $front_backend front:4000;
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }
  }
}
