worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $request_uri $safe_request_uri {
    default $request_uri;
    "~*^/[a-z]{2}/trip-invitations/[^/?]+/?(?:\?.*)?$" /trip-invitations/[REDACTED];
    "~*^/api/public/trip-invitations/[^/?]+/preview(?:\?.*)?$" /api/public/trip-invitations/[REDACTED]/preview;
  }

  map $http_referer $safe_http_referer {
    default $http_referer;
    "~*/[a-z]{2}/trip-invitations/[^/?]+" [REDACTED_TRIP_INVITATION_URL];
    "~*/api/public/trip-invitations/[^/?]+/preview" [REDACTED_TRIP_INVITATION_API_URL];
  }

  log_format redacted '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent '
                      '"$safe_http_referer" "$http_user_agent"';

  access_log /dev/stdout redacted;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 65;
  etag on;

  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_for $preserved_forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
  }

  map $http_x_forwarded_proto $preserved_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_x_forwarded_host $preserved_forwarded_host {
    default $http_x_forwarded_host;
    '' $http_host;
  }

  map $http_x_forwarded_port $preserved_forwarded_port {
    default $http_x_forwarded_port;
    '' $server_port;
  }

  server {
    listen 4000;
    server_name _;
    root /srv/seo;

    # Bootstrap fallback only. Transactions publish a unique front name through
    # an atomic file replacement in the existing directory bind mount.
    set $front_backend front:4000;
    set $deployment_generation bootstrap;
    include /etc/nginx/amusementpark/runtime/*.conf;

    location = /edge-healthz {
      access_log off;
      add_header X-AmusementPark-Deployment $deployment_generation always;
      add_header X-AmusementPark-Worker $pid always;
      return 204;
    }

    location = /api/park-data-editor/official-map-files {
      client_max_body_size 26m;
      proxy_request_buffering off;
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    error_page 418 = @front;
    include /tmp/seo-static-routing.conf;

    location ~* "^/(?:[a-z]{2}/trip-invitations/[^/]+/?|api/public/trip-invitations/[^/]+/preview)$" {
      # Nginx error logs embed the immutable raw request line and cannot use the
      # redaction maps. Access status remains observable through the safe log.
      error_log /dev/null crit;
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location @front {
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location / {
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }
  }
}
