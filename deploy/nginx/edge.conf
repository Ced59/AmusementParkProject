worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 65;
  etag on;

  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_for $preserved_forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
  }

  map $http_x_forwarded_proto $preserved_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_x_forwarded_host $preserved_forwarded_host {
    default $http_x_forwarded_host;
    '' $http_host;
  }

  map $http_x_forwarded_port $preserved_forwarded_port {
    default $http_x_forwarded_port;
    '' $server_port;
  }

  server {
    listen 4000;
    server_name _;
    root /srv/seo;

    location = /edge-healthz {
      access_log off;
      return 204;
    }

    location = /robots.txt {
      try_files /current/robots.txt /previous/robots.txt @front;
      add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400, stale-if-error=86400" always;
      add_header X-AmusementPark-SEO-Source "static" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location = /sitemap.xml {
      try_files /current/sitemap.xml /previous/sitemap.xml @front;
      add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400, stale-if-error=86400" always;
      add_header X-AmusementPark-SEO-Source "static" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location ~ ^/[A-Za-z0-9_-]+\.xml$ {
      try_files /current$uri /previous$uri @front;
      add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400, stale-if-error=86400" always;
      add_header X-AmusementPark-SEO-Source "static" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location @front {
      set $front_backend front:4000;
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }

    location / {
      set $front_backend front:4000;
      proxy_pass http://$front_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $preserved_forwarded_for;
      proxy_set_header X-Forwarded-Proto $preserved_forwarded_proto;
      proxy_set_header X-Forwarded-Host $preserved_forwarded_host;
      proxy_set_header X-Forwarded-Port $preserved_forwarded_port;
      proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
    }
  }
}
