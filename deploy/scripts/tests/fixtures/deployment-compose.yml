services:
  front:
    image: node:24-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-front
    hostname: ${COMPOSE_PROJECT_NAME}-front
    command: ["node", "/fixture/deployment-server.mjs"]
    labels:
      fun.amusement-parks.deployment-generation: ${DEPLOYMENT_GENERATION:-unmanaged}
    environment:
      KIND: front
      FIXTURE_VERSION: ${FIXTURE_VERSION}
      SSR_API_INTERNAL_URL: ${FRONT_SSR_API_INTERNAL_URL}
    volumes: ["./fixture:/fixture:ro", "./control:/control"]
    networks:
      backend_private:
        aliases: [front]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
  api:
    image: node:24-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-api
    hostname: ${COMPOSE_PROJECT_NAME}-api
    command: ["node", "/fixture/deployment-server.mjs"]
    labels:
      fun.amusement-parks.deployment-generation: ${DEPLOYMENT_GENERATION:-unmanaged}
    environment:
      KIND: api
      FIXTURE_VERSION: ${FIXTURE_VERSION}
      DEPLOYMENT_GENERATION: ${DEPLOYMENT_GENERATION:-unmanaged}
      AllowedHosts: ${ALLOWED_HOSTS}
      Ssr__InternalBaseUrl: ${SSR_INTERNAL_BASE_URL}
    volumes: ["./fixture:/fixture:ro", "./control:/control"]
    networks: [backend_private]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 90
  edge:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-edge
    command: ["sh", "-ec", "ln -sf /etc/nginx/amusementpark/seo-static-true.conf /tmp/seo-static-routing.conf; exec nginx -c /etc/nginx/amusementpark/edge.conf -g 'daemon off;'"]
    ports: ["127.0.0.1:${PUBLIC_HTTP_PORT}:4000"]
    volumes: ["./nginx:/etc/nginx/amusementpark:ro", "./seo:/srv/seo:ro"]
    networks: [backend_private]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/edge-healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
  mongodb:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    networks: [backend_private]
  minio:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    networks: [backend_private]
networks:
  backend_private: {}
