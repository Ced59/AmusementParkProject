<section class="park-nearby public-page">
  <app-ui-section-header
    class="park-section-header"
    kickerIconClass="pi pi-map-marker"
    [kickerLabelKey]="titleKey"
    [titleKey]="titleKey"
    [subtitleKey]="subtitleKey">
  </app-ui-section-header>

  <div class="park-nearby__filters">
    <button
      type="button"
      role="switch"
      class="park-nearby__switch"
      [class.park-nearby__switch--checked]="includeStandalone()"
      [attr.aria-checked]="includeStandalone()"
      (click)="toggleStandalone()">
      <span class="park-nearby__switch-track" aria-hidden="true"><span class="park-nearby__switch-thumb"></span></span>
      <span class="park-nearby__switch-label">{{ 'parks.detail.nearby.includeStandalone' | translate }}</span>
    </button>
  </div>

  @if (nearestPark; as closestPark) {
    @if (closestPark.distanceLine) {
      <app-ui-distance-panel
        class="park-nearby__distance-panel"
        titleKey="parks.detail.nearby.closestTitle"
        [sourceLabel]="sourceName"
        [targetLabel]="closestPark.name"
        [distanceValue]="closestPark.distanceLine"
        [durationText]="closestPark.travelDurationLine ?? null"
        noteKey="parks.detail.nearby.distanceNote">
      </app-ui-distance-panel>
    }
  }

  <app-page-state
    [state]="state()"
    [messages]="{
      loadingTitleKey: 'parks.detail.nearby.loadingTitle',
      loadingMessageKey: 'parks.detail.nearby.loadingMessage',
      errorTitleKey: 'parks.detail.nearby.errorTitle',
      errorMessageKey: 'parks.detail.nearby.errorMessage',
      emptyTitleKey: includeStandalone() ? 'parks.detail.nearby.emptyTitle' : 'parks.detail.nearby.emptyParksTitle',
      emptyMessageKey: includeStandalone() ? 'parks.detail.nearby.emptyMessage' : 'parks.detail.nearby.emptyParksMessage'
    }">
    <div class="park-nearby__grid">
      <app-ui-park-card
        *ngFor="let destination of destinations()"
        [park]="destination.card"
        [detailLink]="destination.detailLink"
        primaryActionLabelKey="parks.detail.nearby.viewDestination"
        [showDescriptionInCompact]="true"
        [compact]="true">
      </app-ui-park-card>
    </div>
  </app-page-state>
</section>
