<app-park-detail-view
  [state]="state()"
  [park]="park()"
  [summary]="summary()"
  [weather]="weather()"
  [weatherState]="weatherState()"
  [openingHours]="openingHours()"
  [openingHoursState]="openingHoursState()"
  [liveState]="liveState()"
  [nearbyParks]="nearbyParks()"
  [nearbyState]="nearbyState()"
  [currentLang]="currentLang()"
  [heroImageResponsiveWidths]="heroImageResponsiveWidths"
  [heroImageSizes]="heroImageSizes"
  [heroImageSrcWidth]="heroImageSrcWidth"
  (backClicked)="goBack()"
  (exploreClicked)="goToExplore()"
  (liveRefreshClicked)="refreshLiveData()"
  (visitCreateClicked)="openVisitDialog()">
</app-park-detail-view>

@if (park(); as currentPark) {
  @defer (when visitDialogVisible) {
    <app-passport-visit-quick-create
      [(visible)]="visitDialogVisible"
      [fixedParkId]="currentPark.id"
      [fixedParkName]="currentPark.name">
    </app-passport-visit-quick-create>
  }
}
