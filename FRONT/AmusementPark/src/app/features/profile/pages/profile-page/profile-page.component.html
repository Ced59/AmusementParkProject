<app-profile-page-view
  [state]="state"
  [user]="user"
  [displayAvatarUploadDialog]="displayAvatarUploadDialog"
  [isEditingIdentity]="isEditingIdentity"
  [savingIdentity]="savingIdentity"
  [identityDraft]="identityDraft"
  [avatarCategory]="avatarCategory"
  [userOwnerType]="userOwnerType"
  [currentUserId]="currentUserId"
  [avatarUrl]="user()?.avatarUrl || ''"
  [initialTab]="initialTab"
  (editFieldClicked)="editField($event)"
  (preferredLanguageEditClicked)="editPreferredLanguage()"
  (preferredMeasurementSystemChanged)="updatePreferredMeasurementSystem($event)"
  (saveIdentityClicked)="saveIdentity()"
  (cancelIdentityClicked)="cancelIdentityEdition()"
  (logoutClicked)="logout()"
  (avatarDialogVisibleChange)="onAvatarUploadDialogVisibleChange($event)"
  (avatarUploaded)="onAvatarUploaded($event)"
  (passportOpened)="openPassport()"
  (passportVisitCreateClicked)="openPassportVisitDialog()">
</app-profile-page-view>

<app-passport-visit-quick-create [(visible)]="passportVisitDialogVisible">
</app-passport-visit-quick-create>
