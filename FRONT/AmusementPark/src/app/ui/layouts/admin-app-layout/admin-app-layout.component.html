<div class="app-route-layout app-admin-layout admin-shell">
  <header class="app-admin-layout__header">
    <a class="app-admin-layout__brand" [routerLink]="['/', currentLang, 'home']" aria-label="AMUSEMENT-PARKS.fun">
      <span class="app-admin-layout__brand-icon" aria-hidden="true">
        <i class="pi pi-ticket"></i>
      </span>
      <span class="app-brand-wordmark" aria-hidden="true">
        <span class="app-brand-wordmark__base">AMUSEMENT-PARKS</span>
        <span class="app-brand-wordmark__fun">
          <span class="app-brand-wordmark__dot">.</span>
          <span class="app-brand-wordmark__fun-text">fun</span>
        </span>
      </span>
    </a>

    <div class="app-admin-layout__actions">
      <span class="chip chip--soft">{{ 'admin.title' | translate }}</span>
      <a class="btn-nav btn-nav--ghost" [routerLink]="['/', currentLang, 'home']">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        <span>{{ 'auth.common.back_home' | translate }}</span>
      </a>
    </div>
  </header>

  <div class="app-admin-layout__body">
    <aside class="app-admin-layout__sidebar" aria-label="Administration">
      <div class="app-admin-layout__sidebar-head">
        <span class="kicker kicker--sky">{{ 'admin.m14.kicker' | translate }}</span>
        <strong>{{ 'admin.m14.sidebarTitle' | translate }}</strong>
      </div>

      <nav class="app-admin-layout__nav">
        <a [routerLink]="['/', currentLang, 'admin']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="pi pi-chart-bar" aria-hidden="true"></i>
          <span>{{ 'admin.dashboard.title' | translate }}</span>
        </a>
        @for (item of navigationItems; track item.id) {
          <a [routerLink]="buildAdminRoute(item.segments)" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact }">
            <i [class]="item.iconClass" aria-hidden="true"></i>
            <span>{{ item.titleKey | translate }}</span>
          </a>
        }
      </nav>
    </aside>

    <main class="app-admin-layout__main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
