<div
  class="ui-segmented-tabs"
  role="tablist"
  [style.--ui-segmented-tab-count]="tabs.length"
  [attr.aria-label]="ariaLabelKey | translate">
  @for (tab of tabs; track tab.id; let index = $index) {
    <button
      #tabButton
      class="ui-segmented-tabs__tab"
      type="button"
      role="tab"
      [id]="tabElementId(tab.id)"
      [attr.aria-controls]="panelId"
      [class.is-active]="activeTabId === tab.id"
      [attr.aria-selected]="activeTabId === tab.id"
      [attr.tabindex]="activeTabId === tab.id ? 0 : -1"
      (click)="selectTab(tab.id)"
      (keydown)="onKeydown($event, index)">
      <span>{{ tab.labelKey | translate }}</span>
      @if (tab.count !== null && tab.count !== undefined) {
        <strong>{{ tab.count }}</strong>
      }
    </button>
  }
</div>
