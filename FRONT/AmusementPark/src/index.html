<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amusement Parks</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" href="/assets/fonts/google/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/google/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/satisfy-brand-fun.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="ai-catalog" type="application/ai-catalog+json" href="/ai-catalog.json">
</head>
<body class="dark-mode">
<script data-app-theme-init>
(() => {
  let theme;
  try { theme = localStorage.getItem('amusement-park-theme'); } catch {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  for (const element of [document.documentElement, document.body]) {
    element.classList.toggle('light-mode', theme === 'light');
    element.classList.toggle('dark-mode', theme === 'dark');
  }
})();
</script>
<app-root ngCspNonce="__AMUSEMENTPARK_CSP_NONCE__"></app-root>
</body>
</html>
