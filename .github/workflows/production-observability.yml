name: Production observability

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability
  cancel-in-progress: false

jobs:
  public-production-probe:
    name: Confirm public production health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Validate incident catalog and runbooks
        working-directory: FRONT/AmusementPark
        run: npm run operations:readiness

      - name: Probe production twice before alerting
        id: production-probe
        shell: bash
        working-directory: FRONT/AmusementPark
        env:
          PRODUCTION_ALERT_BASE_URL: https://amusement-parks.fun
          PRODUCTION_ALERT_OUTPUT: ../../artifacts/production-alert-report.json
        run: |
          set +e
          mkdir -p ../../artifacts
          npm run operations:production-monitor
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-alert-report
          path: artifacts/production-alert-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Raise confirmed production alert
        if: steps.production-probe.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "A production incident was confirmed. Follow docs/operations/incidents/production-rollback.md." >&2
          exit 1
