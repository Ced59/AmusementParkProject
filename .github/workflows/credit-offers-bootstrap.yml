name: Bootstrap park pricing credit offers

on:
  push:
    branches:
      - feat/park-pricing-credit-offers

permissions:
  contents: write

jobs:
  implement:
    if: "github.event.head_commit.message == 'chore: bootstrap credit offers implementation'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/park-pricing-credit-offers
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONT/AmusementPark/package-lock.json
      - name: Implement credit offers
        run: |
          python3 tools/credit-offers-bootstrap-fix.py
          python3 tools/credit-offers-bootstrap.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Test .NET projects
        shell: bash
        run: |
          set -euo pipefail
          for project in API/AmusementPark.Core.Tests/AmusementPark.Core.Tests.csproj API/AmusementPark.Application.Tests/AmusementPark.Application.Tests.csproj API/AmusementPark.Infrastructure.Tests/AmusementPark.Infrastructure.Tests.csproj API/AmusementPark.WebAPI.Tests/AmusementPark.WebAPI.Tests.csproj; do
            dotnet test "$project" --configuration Release --nologo
          done
      - name: Install front dependencies
        working-directory: FRONT/AmusementPark
        run: npm ci
      - name: Test front
        working-directory: FRONT/AmusementPark
        run: npm run test:ci
      - name: Build front
        working-directory: FRONT/AmusementPark
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/credit-offers-bootstrap.yml tools/credit-offers-bootstrap.py tools/credit-offers-bootstrap-fix.py
          find FRONT/AmusementPark/src/assets/i18n/source -name 'zz-park-pricing-credit-offers.json' -type f -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
          for file in FRONT/AmusementPark/src/assets/i18n/{de,en,es,fr,it,nl,pl,pt}.json; do
            sed -i 's/[[:space:]]\+$//' "$file"
          done
          git add -A
          git diff --cached --check
          git config user.name "Ced"
          git config user.email "48866272+Ced59@users.noreply.github.com"
          git commit -m "feat(park-pricing): add credit offers"
          git push origin HEAD:feat/park-pricing-credit-offers
