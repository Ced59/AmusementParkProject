name: Temporary product foundations consistency fixes

on:
  push:
    branches:
      - docs/product-growth-technical-foundations
    paths:
      - .github/workflows/docs-product-foundations-fix-temp.yml

permissions:
  contents: write

jobs:
  fix-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/product-growth-technical-foundations
          fetch-depth: 0

      - name: Apply final consistency fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("docs/roadmaps/product-growth/00-technical-foundations-and-architecture-decisions-roadmap.md"): [
                  (
                      "L’échelle autorise exactement vingt? Non : dix valeurs, de `0,5` à `5,0`, par pas de `0,5`.",
                      "L’échelle autorise exactement dix valeurs, de `0,5` à `5,0`, par pas de `0,5`."
                  )
              ],
              Path("docs/roadmaps/product-growth/README.md"): [
                  (
                      "> Base technique auditée : `master` au commit `943f6f9c07548b91582cbe853cf17bb14cbeb0df`, le 27 août 2026.",
                      "> Base fonctionnelle initialement auditée : `master` au commit `943f6f9c07548b91582cbe853cf17bb14cbeb0df`, le 27 août 2026. Les fondations techniques ont ensuite été réévaluées sur `master` au commit `8742d6e657ef6c1c64f6e360e29fe2aa2ae6b019`, le 28 août 2026."
                  )
              ],
              Path("docs/roadmaps/product-growth/02-visit-passport-and-ride-log-roadmap.md"): [
                  (
                      "> Dépendance bloquante : gate `RANK-G` de la roadmap 01.",
                      "> Dépendances bloquantes : gate `FOUNDATION-G` des roadmaps 00/00A, puis gate `RANK-G` de la roadmap 01."
                  )
              ]
          }

          for path, items in replacements.items():
              text = path.read_text(encoding="utf-8")
              changed = False
              for old, new in items:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
                  changed = True
              if changed:
                  path.write_text(text, encoding="utf-8")

      - name: Validate final documentation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "vingt? Non" docs/roadmaps/product-growth
          grep -q "Dépedances" /dev/null 2>/dev/null || true
          grep -q "FOUNDATION-G.*RANK-G" docs/roadmaps/product-growth/02-visit-passport-and-ride-log-roadmap.md
          grep -q "8742d6e657ef6c1c64f6e360e29fe2aa2ae6b019" docs/roadmaps/product-growth/README.md
          git diff --check

      - name: Commit consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmaps/product-growth
          git commit -m "docs: finaliser la cohérence des fondations techniques"
          git push origin HEAD:docs/product-growth-technical-foundations
